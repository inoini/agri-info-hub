spring.application.name=agri-info-hub

# ローカルでは8082、RenderではPORT環境変数を使用します。
server.address=0.0.0.0
server.port=${PORT:8082}

# ローカルはH2、RenderではSPRING_DATASOURCE_*をNeonの値に設定します。
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/agri-info-hub}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=0

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# RSSは初回起動3秒後、その後1時間ごとに取得します。
agri.feed.initial-delay-ms=3000
agri.feed.interval-ms=3600000
